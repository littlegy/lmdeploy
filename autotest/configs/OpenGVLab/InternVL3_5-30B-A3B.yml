      - base
      - logprob
      - responses
      - anthropic
      - toolcall
      extra:
        logprobs-mode: raw_logprobs
        tool-call-parser: qwen3
  gen_config:
    repetition-penalty: 1.0
    top-p: 0.8
    top-k: 20
    temperature: 0.7
