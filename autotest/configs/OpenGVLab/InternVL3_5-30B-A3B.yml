a100:
- model_type:
  - chat
  - vl
  engine_config:
    tp: 2
  backends:
  - name: turbomind
    communicators:
    - nccl
    - cuda-ipc
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - func
  - mllm_evaluate
  interface:
    pytorch:
      suites:
      - base
      - logprob
      - responses
      - anthropic
      - toolcall
      extra:
        logprobs-mode: raw_logprobs
