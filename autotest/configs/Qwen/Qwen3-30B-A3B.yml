# HF model id: Qwen/Qwen3-30B-A3B

a100:
- model_type: chat
  engine_config:
    tp: 2
    extra:
      session-len: 65536
  backends:
  - name: turbomind
    communicators:
    - nccl
    - cuda-ipc
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - benchmark
  - evaluate
  - func
  - longtext_benchmark
  - prefix_cache
  interface:
    pytorch:
      suites:
      - base
      - logprob
      - experts
      - responses
      - anthropic
      extra:
        logprobs-mode: raw_logprobs
        enable-prefix-caching: true
        enable-return-routed-experts: true
    turbomind:
      suites:
      - base
      - logprob
      - responses
      - anthropic
      extra:
        logprobs-mode: raw_logprobs
        enable-prefix-caching: true
  quantization:
    turbomind:
    - kvint8
    pytorch:
    - kvint8
