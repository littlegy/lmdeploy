name: daily_ete_test_h_refactor
# lmdeploy_refactor autotest: pytest layout markers (tp1/tp2/..., dp16ep16, distributed).
# Legacy daily_ete_test_h.yml uses gpu_num_* for lmdeploy_restful / lmdeploy_sleep.


on:
  workflow_dispatch:
    inputs:
      repo_org:
        required: false
        description: 'Tested repository organization name. Default is InternLM'
        type: string
        default: 'InternLM/lmdeploy'
      repo_ref:
        required: false
        description: 'Set branch or tag or commit id. Default is "main"'
        type: string
        default: 'main'
      backend:
        required: true
        description: 'Set backend filter. Default is "["turbomind", "pytorch"]"'
        type: string
        default: '["turbomind", "pytorch"]'
      model:
        required: true
        description: 'Set testcase module filter: llm, mllm. Default contains all models'
        type: string
        default: '["llm", "mllm"]'
      function:
        required: true
        description: 'Set testcase function filter: chat, restful, pipeline, prefix_cache. Default contains all functions'
        type: string
        default: '["pipeline", "restful", "chat", "prefix_cache"]'
      use_whl:
        required: false
        description: 'true: build whl from source and install; false: use lmdeploy from Docker image directly'
        type: boolean
        default: false
      offline_mode:
        required: false
        description: 'When use_whl=true and offline_mode=true, skip build and use pre-placed whl in work_dir directly'
        type: boolean
        default: false
      regression_func:
        required: true
        description: 'regression functions'
        type: string
        default: '["quant", "tools", "pipeline", "restful"]'
      docker_image:
        required: false
        description: 'Docker image for rjob submission'
        type: string
        default: 'registry.h.pjlab.org.cn/ailab-puyu-puyu_gpu/lmdeploy-dev:main-03153c6-cu13.0'
      test_env:
        required: false
        description: 'Test environment config: h, h800, 3090, 5080, ascend'
        type: string
        default: 'h'
      gpu_per_node:
        required: false
        description: 'GPUs per node in OC cluster (default: 8). Used for rjob --gpu and pytest -n (ACTUAL_GPU/tp_size).'
        type: string
        default: '8'
      interface_tp_nums:
        required: false
        description: 'Which layout tp markers to run (tp1,tp2,tp4,tp8). "8" = only tp8; "1" = only tp1; "1,2,4,8" = all. Also gates tp2dp4ep8 (needs 8).'
        type: string
        default: '1,2,4,8'
      interface_run_distributed:
        required: false
        description: 'If false, skip multi-node interface (tp16/dp16ep16). Independent of interface_tp_nums.'
        type: boolean
        default: true
      work_dir:
        required: false
        description: 'Working directory for code repo (contains requirements/, autotest/, etc.)'
        type: string
        default: '/mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/work_dir/lmdeploy_refactor'
      transformers_version:
        required: false
        description: 'Optional transformers version override (e.g. 4.57.6). Empty means use image default'
        type: string
        default: ''
      rjob_group:
        required: false
        description: 'Optional rjob partition/group; namespace is derived (e.g. llmrazor_gpu → ailab-llmrazor, updatedriver → ailab-zskj)'
        type: choice
        options:
          - llmrazor_gpu
          - llmeval_gpu
          - opencompass_gpu
          - evalservice_gpu
          - updatedriver
        default: 'llmrazor_gpu'
      rjob_charged_group:
        required: false
        description: 'rjob --charged-group (billing pool, e.g. llmrazor_gpu_pool). Empty falls back to rjob_group.'
        type: string
        default: ''

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  OUTPUT_FOLDER: cuda13.0_dist_${{ github.run_id }}
  WORK_DIR: ${{ inputs.work_dir || '/mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/work_dir/lmdeploy_refactor' }}
  DOCKER_IMAGE: ${{ inputs.docker_image || 'registry.h.pjlab.org.cn/ailab-puyu-puyu_gpu/lmdeploy-dev:main-03153c6-cu13.0' }}
  TEST_ENV: ${{ inputs.test_env || 'h' }}
  GPU_PER_NODE: ${{ inputs.gpu_per_node || '8' }}
  INTERFACE_TP_NUMS: ${{ inputs.interface_tp_nums || '1,2,4,8' }}
  INTERFACE_RUN_DISTRIBUTED: ${{ inputs.interface_run_distributed == false && 'false' || 'true' }}
  RUN_ID: ${{ inputs.repo_ref || 'main' }}_${{ github.run_id }}
  REPORT_DIR: /mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/eval_resource/test-reports/${{ inputs.repo_ref || 'main' }}_${{ github.run_id }}
  ALLURE_REPORT_DIR: /mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/eval_resource/test-reports/allure_report/${{ inputs.repo_ref || 'main' }}_${{ github.run_id }}
  USE_WHL: ${{ inputs.use_whl || 'false' }}
  TRANSFORMERS_VERSION: ${{ inputs.transformers_version || '' }}
  COV_PARAM: --cov /opt/py3/lib/python3.10/site-packages/lmdeploy
  RJOB_GROUP: ${{ inputs.rjob_group || 'llmrazor_gpu' }}
  RJOB_CHARGED_GROUP: ${{ inputs.rjob_charged_group || inputs.rjob_group || 'llmrazor_gpu' }}
  RJOB_NAMESPACE: ${{ (inputs.rjob_group || 'llmrazor_gpu') == 'updatedriver' && 'ailab-zskj' || ((inputs.rjob_group || 'llmrazor_gpu') == 'llmeval_gpu' && 'ailab-llmeval' || ((inputs.rjob_group || 'llmrazor_gpu') == 'evalservice_gpu' && 'ailab-evalservice' || ((inputs.rjob_group || 'llmrazor_gpu') == 'opencompass_gpu' && 'ailab-opencompass' || 'ailab-llmrazor'))) }}

jobs:
  linux-build:
    if: ${{!cancelled() && inputs.use_whl && !inputs.offline_mode}}
    strategy:
      matrix:
        pyver: [py310]
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: ${{ matrix.pyver }}
      PLAT_NAME: manylinux2014_x86_64
      DOCKER_TAG: cuda13.0
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          repository: ${{ github.event.inputs.repo_org || 'InternLM/lmdeploy' }}
          ref: ${{github.event.inputs.repo_ref || 'main'}}
      - name: Build
        run: |
          echo ${PYTHON_VERSION}
          echo ${PLAT_NAME}
          echo ${DOCKER_TAG}
          echo ${OUTPUT_FOLDER}
          echo ${GITHUB_RUN_ID}
          # remove -it
          sed -i 's/docker run --rm -it/docker run --rm/g' builder/manywheel/build_wheel.sh
          bash builder/manywheel/build_wheel.sh ${PYTHON_VERSION} ${PLAT_NAME} ${DOCKER_TAG} ${OUTPUT_FOLDER}
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: builder/manywheel/${{ env.OUTPUT_FOLDER }}
          retention-days: 1
          name: my-artifact-${{ github.run_id }}-${{ matrix.pyver }}


  download_pkgs:
    needs: linux-build
    if: ${{!cancelled() && inputs.use_whl && !inputs.offline_mode}}
    runs-on: [self-hosted, h-razor]
    timeout-minutes: 50
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: my-artifact-${{ github.run_id }}-py310
      - name: Copy Artifacts to WORK_DIR
        run: rm ${{env.WORK_DIR}}/lmdeploy-*.whl -f && cp lmdeploy-*.whl ${{env.WORK_DIR}}

  prepare_env:
    if: ${{!cancelled()}}
    needs: download_pkgs
    runs-on: [self-hosted, h-razor]
    timeout-minutes: 10
    steps:
      - name: Mark as start
        run: |
          mkdir -p ${{env.REPORT_DIR}}
          mkdir -p ${{env.ALLURE_REPORT_DIR}}
          echo "starttime=$(date +%s)" > ${{env.REPORT_DIR}}/status.txt


  test_quantization:
    needs: prepare_env
    if: ${{!cancelled() && (github.event_name == 'schedule' || contains(fromJSON(github.event.inputs.regression_func), 'quant'))}}
    runs-on: [self-hosted, h-razor]
    timeout-minutes: 30
    steps:
      - name: Submit quantization test job via rjob
        env:
          BACKENDS_JSON: ${{ inputs.backend }}
        run: |
          set -e

          # ============================================================
          # Configuration
          # ============================================================
          WORK_DIR="${{ env.WORK_DIR }}"
          DOCKER_IMAGE="${{ env.DOCKER_IMAGE }}"
          TEST_ENV="${{ env.TEST_ENV }}"
          GPU_PER_NODE=${{ env.GPU_PER_NODE }}
          RUN_ID="${{ env.RUN_ID }}"
          REPORT_DIR="${{ env.REPORT_DIR }}"
          ALLURE_REPORT_DIR="${{ env.ALLURE_REPORT_DIR }}"
          COV_PARAM="${{ env.COV_PARAM }}"
          USE_WHL="${{ env.USE_WHL }}"

          # Resource calculation (8 GPU for quantization)
          ACTUAL_GPU=${GPU_PER_NODE}
          CPU_PER_NODE=$(( ACTUAL_GPU * 10 ))
          MEMORY_MB=$(( ACTUAL_GPU * 50000 ))

          # ============================================================
          # Parse backends
          # ============================================================
          BACKENDS=$(echo "${BACKENDS_JSON}" | tr -d '[]"' | tr -d "'" | tr ',' ' ')
          HAS_TURBOMIND=false
          HAS_PYTORCH=false
          for b in $BACKENDS; do
            b=$(echo $b | tr -d ' ')
            case $b in
              turbomind) HAS_TURBOMIND=true ;;
              pytorch) HAS_PYTORCH=true ;;
            esac
          done

          # ============================================================
          # Common env vars & mounts (matching submit_oc.sh)
          # ============================================================
          COMMON_ENV_VARS="-e HF_HUB_CACHE=/mnt/shared-storage-gpfs2/gpfs2-shared-public/huggingface/hub \
            -e HF_DATASETS_CACHE=/mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/eval_resource/hf_cache \
            -e TIKTOKEN_CACHE_DIR=/mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/eval_resource/share_tiktoken \
            -e TIKTOKEN_ENCODINGS_BASE=/mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/eval_resource/tiktoken_encodings \
            -e HF_DATASETS_OFFLINE=1 \
            -e TRANSFORMERS_OFFLINE=1 \
            -e HF_EVALUATE_OFFLINE=1 \
            -e HF_HUB_OFFLINE=1 \
            -e TEST_ENV=${TEST_ENV} \
            -e RUN_ID=${RUN_ID} \
            -e PIP_INDEX_URL=\"http://mirrors.i.h.pjlab.org.cn/pypi/simple/\" \
            -e PIP_EXTRA_INDEX_URL=\"http://pypi.i.h.pjlab.org.cn/brain/dev/+simple\" \
            -e PIP_TRUSTED_HOST=\"mirrors.i.h.pjlab.org.cn pypi.i.h.pjlab.org.cn\""

          COMMON_MOUNTS="--mount=gpfs://gpfs1/llmrazor-share:/mnt/shared-storage-user/llmrazor-share \
            --mount=gpfs://gpfs1/large-model-center-share-weights:/mnt/shared-storage-user/large-model-center-share-weights \
            --mount=gpfs://gpfs1/puyudelivery:/mnt/shared-storage-user/puyudelivery \
            --mount=gpfs://gpfs2/gpfs2-shared-public:/mnt/shared-storage-gpfs2/gpfs2-shared-public \
            --mount=gpfs://gpfs2/llmit1:/mnt/shared-storage-gpfs2/llmit1"

          # ============================================================
          # Pip setup (conditionally install whl or use Docker env)
          # ============================================================
          WHL_INSTALL=""
          if [ "${USE_WHL}" == "true" ]; then
            WHL_INSTALL="pip uninstall lmdeploy -y; pip install lmdeploy-*.whl --no-deps; "
          fi

          TRANSFORMERS_PIP=""
          if [ -n "${TRANSFORMERS_VERSION}" ]; then
            TRANSFORMERS_PIP="pip install transformers==${TRANSFORMERS_VERSION} --no-cache-dir; "
          elif [[ "${TEST_ENV}" == *"legacy"* ]]; then
            TRANSFORMERS_PIP="pip install transformers==4.57.6 --no-cache-dir; "
          fi

          PIP_SETUP="cd ${WORK_DIR}; \
            pip install auto_gptq matplotlib attrdict --no-cache-dir; \
            pip install -r requirements/lite.txt --no-cache-dir; \
            ${WHL_INSTALL}\
            pip install pytest --no-cache-dir; \
            pip install /mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/work_dir/pytest_rerunfailures-16.5-py3-none-any.whl --no-cache-dir --no-deps; \
            pip install /mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/work_dir/pytest_assume-2.4.3-py3-none-any.whl; \
            pip install -r requirements/test.txt --no-cache-dir; \
            ${TRANSFORMERS_PIP}\
            mkdir -p ${REPORT_DIR}; mkdir -p ${ALLURE_REPORT_DIR};"

          # ============================================================
          # Build test commands based on backend selection
          # ============================================================
          TEST_CMDS=""
          if $HAS_TURBOMIND; then
            TEST_CMDS+="(pytest autotest/tools/quantization/test_quantization_awq.py -m \"not pr_test\" -n ${ACTUAL_GPU} --alluredir=${ALLURE_REPORT_DIR} --clean-alluredir ${COV_PARAM} || true); "
          fi
          if $HAS_PYTORCH; then
            if [ -f "${WORK_DIR}/autotest/tools/quantization/test_quantization_w8a8.py" ]; then
              TEST_CMDS+="(pytest autotest/tools/quantization/test_quantization_w8a8.py -n ${ACTUAL_GPU} --alluredir=${ALLURE_REPORT_DIR} ${COV_PARAM} || true); "
            else
              echo "test_quantization_w8a8.py not found, skip pytorch quant in refactor tree"
            fi
          fi

          if [ -z "$TEST_CMDS" ]; then
            echo "No test commands to run, skipping..."
            exit 0
          fi

          # ============================================================
          # Submit rjob
          # ============================================================
          GITHUB_RUN_ID="${{ github.run_id }}"
          make_rjob_name() {
            local tag="$1"
            local suffix="${GITHUB_RUN_ID: -6}$(printf '%04d' $((RANDOM % 10000)))"
            local name="ete-rfr-${tag}-${suffix}"
            name=$(echo "${name}" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9-]/-/g' -e 's/--*/-/g' -e 's/^-*//' -e 's/-*$//')
            local max_len=49  # kubebrain webhook: job name must be < 50 chars
            if [ ${#name} -gt ${max_len} ]; then
              local prefix_max=$((max_len - ${#suffix} - 1))
              local prefix="ete-rfr-${tag}"
              prefix=$(echo "${prefix}" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9-]/-/g' -e 's/--*/-/g' -e 's/^-*//' -e 's/-*$//')
              if [ ${#prefix} -gt ${prefix_max} ]; then
                prefix="${prefix:0:${prefix_max}}"
                prefix=$(echo "${prefix}" | sed -e 's/-*$//')
              fi
              name="${prefix}-${suffix}"
            fi
            echo "${name}"
          }
          JOB_NAME=$(make_rjob_name "quant")

          RJOB_CMD="rjob submit \
            --name=${JOB_NAME} \
            --task_name=t0 \
            --namespace=${{ env.RJOB_NAMESPACE }} \
            --charged-group=${{ env.RJOB_CHARGED_GROUP }} \
            --private-machine=group \
            --group=${{ env.RJOB_GROUP }} \
            --gpu=${ACTUAL_GPU} \
            --cpu=${CPU_PER_NODE} \
            --memory=${MEMORY_MB} \
            --image=${DOCKER_IMAGE} \
            ${COMMON_ENV_VARS} \
            ${COMMON_MOUNTS} \
            --host-network=False \
            -- bash -exc '${PIP_SETUP} ${TEST_CMDS}'"

          echo "=== Executing ===" && echo "$RJOB_CMD" | sed 's/  */ \\\n  /g' && echo "================="
          eval "$RJOB_CMD"
          echo "=== Submitted: ${JOB_NAME} ==="


  test_tools:
    if: ${{!cancelled() && (github.event_name == 'schedule' || contains(fromJSON(github.event.inputs.regression_func), 'tools'))}}
    runs-on: [self-hosted, h-razor]
    needs: test_quantization
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(inputs.backend || '["turbomind", "pytorch"]')}}
        model: ${{ fromJSON(inputs.model || '["llm", "mllm"]')}}
        function: ${{ fromJSON(inputs.function || '["pipeline","restful","chat","prefix_cache"]')}}
        exclude:
          - backend: turbomind
            model: mllm
            function: chat
          - backend: pytorch
            model: mllm
            function: chat
          - backend: turbomind
            model: mllm
            function: prefix_cache
          - backend: pytorch
            model: mllm
            function: prefix_cache
        include:
          - backend: turbomind
            model: llm
            function: other
    steps:
      - name: Submit tools test job via rjob
        env:
          BACKEND: ${{ matrix.backend }}
          MODEL: ${{ matrix.model }}
          FUNC: ${{ matrix.function }}
          BACKENDS_JSON: ${{ inputs.backend || '["turbomind", "pytorch"]' }}
        run: |
          set -e

          # Skip matrix combinations not in backend filter (include may add extra backends)
          BACKENDS=$(echo "${BACKENDS_JSON}" | tr -d '[]"' | tr -d "'" | tr ',' ' ')
          SKIP=true
          for b in $BACKENDS; do
            b=$(echo "$b" | tr -d ' ')
            [ "$b" = "$BACKEND" ] && SKIP=false && break
          done
          if $SKIP; then
            echo "Backend ${BACKEND} not in ${BACKENDS_JSON}, skipping..."
            exit 0
          fi

          # ============================================================
          # Configuration
          # ============================================================
          WORK_DIR="${{ env.WORK_DIR }}"
          DOCKER_IMAGE="${{ env.DOCKER_IMAGE }}"
          TEST_ENV="${{ env.TEST_ENV }}"
          GPU_PER_NODE=${{ env.GPU_PER_NODE }}
          RUN_ID="${{ env.RUN_ID }}"
          REPORT_DIR="${{ env.REPORT_DIR }}"
          ALLURE_REPORT_DIR="${{ env.ALLURE_REPORT_DIR }}"
          COV_PARAM="${{ env.COV_PARAM }}"
          USE_WHL="${{ env.USE_WHL }}"
          BACKEND="${BACKEND}"
          MODEL="${MODEL}"
          FUNC="${FUNC}"

          # 逻辑 GPU 数（pytest 并行度仍按此计算）；restful 与 submit_interface_tests.sh 对齐：
          # - 每卡内存 64000MB（大模型 / level-2 update_weights 预留）
          # - 每节点 <8 卡时多申 1 张 staging 卡 + TOTAL_GPU_COUNT + LMDEPLOY_UPDATE_WEIGHTS_CUDA_DEVICE
          # - ≥8 卡时不加卡，注入 LMDEPLOY_SKIP_INTERFACE_SLEEP_WAKEUP（与 submit 一致）
          ACTUAL_GPU=${GPU_PER_NODE}
          RJOB_GPU=${ACTUAL_GPU}
          MEMORY_PER_GPU_MB=50000
          TOOLS_RESTFUL_EXTRA_ENV=""
          if [ "$FUNC" = "restful" ] || [ "$FUNC" = "prefix_cache" ]; then
            MEMORY_PER_GPU_MB=64000
            if [ "${ACTUAL_GPU}" -lt 8 ]; then
              RJOB_GPU=$(( ACTUAL_GPU + 1 ))
              TOOLS_RESTFUL_EXTRA_ENV=" -e DISTRIBUTED_JOB=true -e TOTAL_GPU_COUNT=${ACTUAL_GPU} -e LMDEPLOY_UPDATE_WEIGHTS_CUDA_DEVICE=${ACTUAL_GPU}"
            else
              TOOLS_RESTFUL_EXTRA_ENV=" -e LMDEPLOY_SKIP_INTERFACE_SLEEP_WAKEUP=1"
            fi
          fi
          CPU_PER_NODE=$(( RJOB_GPU * 10 ))
          MEMORY_MB=$(( RJOB_GPU * MEMORY_PER_GPU_MB ))

          # ============================================================
          # Common env vars & mounts
          # ============================================================
          COMMON_ENV_VARS="-e HF_HUB_CACHE=/mnt/shared-storage-gpfs2/gpfs2-shared-public/huggingface/hub \
            -e HF_DATASETS_CACHE=/mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/eval_resource/hf_cache \
            -e TIKTOKEN_CACHE_DIR=/mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/eval_resource/share_tiktoken \
            -e TIKTOKEN_ENCODINGS_BASE=/mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/eval_resource/tiktoken_encodings \
            -e HF_DATASETS_OFFLINE=1 \
            -e TRANSFORMERS_OFFLINE=1 \
            -e HF_EVALUATE_OFFLINE=1 \
            -e HF_HUB_OFFLINE=1 \
            -e TEST_ENV=${TEST_ENV} \
            -e RUN_ID=${RUN_ID} \
            -e PIP_INDEX_URL=\"http://mirrors.i.h.pjlab.org.cn/pypi/simple/\" \
            -e PIP_EXTRA_INDEX_URL=\"http://pypi.i.h.pjlab.org.cn/brain/dev/+simple\" \
            -e PIP_TRUSTED_HOST=\"mirrors.i.h.pjlab.org.cn pypi.i.h.pjlab.org.cn\""

          COMMON_MOUNTS="--mount=gpfs://gpfs1/llmrazor-share:/mnt/shared-storage-user/llmrazor-share \
            --mount=gpfs://gpfs1/large-model-center-share-weights:/mnt/shared-storage-user/large-model-center-share-weights \
            --mount=gpfs://gpfs1/puyudelivery:/mnt/shared-storage-user/puyudelivery \
            --mount=gpfs://gpfs2/gpfs2-shared-public:/mnt/shared-storage-gpfs2/gpfs2-shared-public \
            --mount=gpfs://gpfs2/llmit1:/mnt/shared-storage-gpfs2/llmit1"

          # ============================================================
          # Pip setup (conditionally install whl or use Docker env)
          # ============================================================
          WHL_INSTALL=""
          if [ "${USE_WHL}" == "true" ]; then
            WHL_INSTALL="pip uninstall lmdeploy -y; pip install lmdeploy-*.whl --no-deps; "
          fi

          EXTRA_PIP=""
          if [ "$FUNC" == "other" ]; then
            EXTRA_PIP="pip install lagent --no-cache-dir; "
          fi

          TRANSFORMERS_PIP=""
          if [ -n "${TRANSFORMERS_VERSION}" ]; then
            TRANSFORMERS_PIP="pip install transformers==${TRANSFORMERS_VERSION} --no-cache-dir; "
          elif [[ "${TEST_ENV}" == *"legacy"* ]]; then
            TRANSFORMERS_PIP="pip install transformers==4.57.6 --no-cache-dir; "
          fi

          PIP_SETUP="cd ${WORK_DIR}; \
            ${WHL_INSTALL}\
            pip install pytest --no-cache-dir; \
            pip install /mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/work_dir/pytest_rerunfailures-16.5-py3-none-any.whl --no-cache-dir --no-deps; \
            pip install /mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/work_dir/pytest_assume-2.4.3-py3-none-any.whl; \
            pip install -r requirements/test.txt --no-cache-dir; \
            ${EXTRA_PIP}\
            ${TRANSFORMERS_PIP}\
            mkdir -p ${REPORT_DIR}; mkdir -p ${ALLURE_REPORT_DIR};"

          # ============================================================
          # Build test commands based on matrix values
          # tpX layout marker → -n = ACTUAL_GPU / X
          # ============================================================
          TEST_CMDS=""
          PYTEST_K_EXTRA="not modelscope"

          if [ "$FUNC" == "chat" ] && [ "$MODEL" == "llm" ]; then
            TEST_FILE="autotest/tools/chat/test_command_chat_hf_${BACKEND}.py"
          elif [ "$FUNC" == "pipeline" ]; then
            TEST_FILE="autotest/tools/pipeline/test_pipeline_chat_${BACKEND}_${MODEL}.py"
            PYTEST_K_EXTRA="not modelscope and not prefix_cache"
          elif [ "$FUNC" == "restful" ]; then
            TEST_FILE="autotest/tools/restful/test_restful_chat_hf_${BACKEND}_${MODEL}.py"
            PYTEST_K_EXTRA="not modelscope and not prefix_cache"
          elif [ "$FUNC" == "prefix_cache" ]; then
            if [ "$MODEL" != "llm" ]; then
              echo "prefix_cache only supports llm, skipping..."
              exit 0
            fi
            TEST_FILE=""
            for tp_size in 1 2 4 8; do
              N=$(( ACTUAL_GPU / tp_size ))
              [ $N -lt 1 ] && continue
              for TEST_FILE in \
                "autotest/tools/pipeline/test_pipeline_chat_${BACKEND}_llm.py" \
                "autotest/tools/restful/test_restful_chat_hf_${BACKEND}_llm.py"; do
                if [ $N -eq 1 ]; then
                  TEST_CMDS+="(pytest ${TEST_FILE} -m \"tp${tp_size} and not pr_test\" -k \"prefix_cache\" --alluredir=${ALLURE_REPORT_DIR} ${COV_PARAM} || true); "
                else
                  TEST_CMDS+="(pytest ${TEST_FILE} -m \"tp${tp_size} and not pr_test\" -k \"prefix_cache\" -n ${N} --alluredir=${ALLURE_REPORT_DIR} ${COV_PARAM} || true); "
                fi
              done
            done
          elif [ "$FUNC" == "other" ]; then
            TEST_FILE=""
            TEST_CMDS+="(pytest autotest/toolchain --alluredir=${ALLURE_REPORT_DIR} ${COV_PARAM} || true); "
          fi

          if [ "$FUNC" != "prefix_cache" ] && [ -n "$TEST_FILE" ]; then
            for tp_size in 1 2 4 8; do
              N=$(( ACTUAL_GPU / tp_size ))
              [ $N -lt 1 ] && continue
              if [ $N -eq 1 ]; then
                TEST_CMDS+="(pytest ${TEST_FILE} -m \"tp${tp_size} and not pr_test\" -k \"${PYTEST_K_EXTRA}\" --alluredir=${ALLURE_REPORT_DIR} ${COV_PARAM} || true); "
              else
                TEST_CMDS+="(pytest ${TEST_FILE} -m \"tp${tp_size} and not pr_test\" -k \"${PYTEST_K_EXTRA}\" -n ${N} --alluredir=${ALLURE_REPORT_DIR} ${COV_PARAM} || true); "
              fi
            done
          fi

          if [ -z "$TEST_CMDS" ]; then
            echo "No test commands for ${BACKEND}/${MODEL}/${FUNC}, skipping..."
            exit 0
          fi

          # ============================================================
          # Submit rjob
          # ============================================================
          GITHUB_RUN_ID="${{ github.run_id }}"
          make_rjob_name() {
            local tag="$1"
            local suffix="${GITHUB_RUN_ID: -6}$(printf '%04d' $((RANDOM % 10000)))"
            local name="ete-rfr-${tag}-${suffix}"
            name=$(echo "${name}" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9-]/-/g' -e 's/--*/-/g' -e 's/^-*//' -e 's/-*$//')
            local max_len=49  # kubebrain webhook: job name must be < 50 chars
            if [ ${#name} -gt ${max_len} ]; then
              local prefix_max=$((max_len - ${#suffix} - 1))
              local prefix="ete-rfr-${tag}"
              prefix=$(echo "${prefix}" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9-]/-/g' -e 's/--*/-/g' -e 's/^-*//' -e 's/-*$//')
              if [ ${#prefix} -gt ${prefix_max} ]; then
                prefix="${prefix:0:${prefix_max}}"
                prefix=$(echo "${prefix}" | sed -e 's/-*$//')
              fi
              name="${prefix}-${suffix}"
            fi
            echo "${name}"
          }
          case "${BACKEND}" in turbomind) B_TAG=tm;; pytorch) B_TAG=pt;; *) B_TAG="${BACKEND}";; esac
          case "${MODEL}" in llm) M_TAG=l;; mllm) M_TAG=m;; *) M_TAG="${MODEL}";; esac
          case "${FUNC}" in pipeline) F_TAG=pl;; chat) F_TAG=ch;; other) F_TAG=ot;; *) F_TAG="${FUNC}";; esac
          JOB_NAME=$(make_rjob_name "tls-${B_TAG}-${M_TAG}-${F_TAG}")

          RJOB_CMD="rjob submit \
            --name=${JOB_NAME} \
            --task_name=t0 \
            --namespace=${{ env.RJOB_NAMESPACE }} \
            --charged-group=${{ env.RJOB_CHARGED_GROUP }} \
            --private-machine=group \
            --group=${{ env.RJOB_GROUP }} \
            --gpu=${RJOB_GPU} \
            --cpu=${CPU_PER_NODE} \
            --memory=${MEMORY_MB} \
            --image=${DOCKER_IMAGE} \
            ${COMMON_ENV_VARS} \
            ${COMMON_MOUNTS} \
            ${TOOLS_RESTFUL_EXTRA_ENV} \
            --host-network=False \
            -- bash -exc '${PIP_SETUP} ${TEST_CMDS}'"

          echo "=== Executing ===" && echo "$RJOB_CMD" | sed 's/  */ \\\n  /g' && echo "================="
          eval "$RJOB_CMD"
          echo "=== Submitted: ${JOB_NAME} ==="


  test_pipeline:
    if: ${{!cancelled() && (github.event_name == 'schedule' || contains(fromJSON(github.event.inputs.regression_func), 'pipeline'))}}
    runs-on: [self-hosted, h-razor]
    needs: test_quantization
    timeout-minutes: 30
    steps:
      - name: Submit pipeline test job via rjob
        run: |
          set -e

          # ============================================================
          # Configuration
          # ============================================================
          WORK_DIR="${{ env.WORK_DIR }}"
          DOCKER_IMAGE="${{ env.DOCKER_IMAGE }}"
          TEST_ENV="${{ env.TEST_ENV }}"
          GPU_PER_NODE=${{ env.GPU_PER_NODE }}
          RUN_ID="${{ env.RUN_ID }}"
          REPORT_DIR="${{ env.REPORT_DIR }}"
          ALLURE_REPORT_DIR="${{ env.ALLURE_REPORT_DIR }}"
          COV_PARAM="${{ env.COV_PARAM }}"
          USE_WHL="${{ env.USE_WHL }}"

          ACTUAL_GPU=${GPU_PER_NODE}
          CPU_PER_NODE=$(( ACTUAL_GPU * 10 ))
          MEMORY_MB=$(( ACTUAL_GPU * 50000 ))

          # ============================================================
          # Common env vars & mounts
          # ============================================================
          COMMON_ENV_VARS="-e HF_HUB_CACHE=/mnt/shared-storage-gpfs2/gpfs2-shared-public/huggingface/hub \
            -e HF_DATASETS_CACHE=/mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/eval_resource/hf_cache \
            -e TIKTOKEN_CACHE_DIR=/mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/eval_resource/share_tiktoken \
            -e TIKTOKEN_ENCODINGS_BASE=/mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/eval_resource/tiktoken_encodings \
            -e HF_DATASETS_OFFLINE=1 \
            -e TRANSFORMERS_OFFLINE=1 \
            -e HF_EVALUATE_OFFLINE=1 \
            -e HF_HUB_OFFLINE=1 \
            -e TEST_ENV=${TEST_ENV} \
            -e RUN_ID=${RUN_ID} \
            -e PIP_INDEX_URL=\"http://mirrors.i.h.pjlab.org.cn/pypi/simple/\" \
            -e PIP_EXTRA_INDEX_URL=\"http://pypi.i.h.pjlab.org.cn/brain/dev/+simple\" \
            -e PIP_TRUSTED_HOST=\"mirrors.i.h.pjlab.org.cn pypi.i.h.pjlab.org.cn\""

          COMMON_MOUNTS="--mount=gpfs://gpfs1/llmrazor-share:/mnt/shared-storage-user/llmrazor-share \
            --mount=gpfs://gpfs1/large-model-center-share-weights:/mnt/shared-storage-user/large-model-center-share-weights \
            --mount=gpfs://gpfs1/puyudelivery:/mnt/shared-storage-user/puyudelivery \
            --mount=gpfs://gpfs2/gpfs2-shared-public:/mnt/shared-storage-gpfs2/gpfs2-shared-public \
            --mount=gpfs://gpfs2/llmit1:/mnt/shared-storage-gpfs2/llmit1"

          # ============================================================
          # Pip setup (conditionally install whl or use Docker env)
          # ============================================================
          WHL_INSTALL=""
          if [ "${USE_WHL}" == "true" ]; then
            WHL_INSTALL="pip uninstall lmdeploy -y; pip install lmdeploy-*.whl --no-deps; "
          fi

          TRANSFORMERS_PIP=""
          if [ -n "${TRANSFORMERS_VERSION}" ]; then
            TRANSFORMERS_PIP="pip install transformers==${TRANSFORMERS_VERSION} --no-cache-dir; "
          elif [[ "${TEST_ENV}" == *"legacy"* ]]; then
            TRANSFORMERS_PIP="pip install transformers==4.57.6 --no-cache-dir; "
          fi

          PIP_SETUP="cd ${WORK_DIR}; \
            ${WHL_INSTALL}\
            pip install pytest --no-cache-dir; \
            pip install /mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/work_dir/pytest_rerunfailures-16.5-py3-none-any.whl --no-cache-dir --no-deps; \
            pip install /mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/work_dir/pytest_assume-2.4.3-py3-none-any.whl; \
            pip install -r requirements/test.txt --no-cache-dir; \
            ${TRANSFORMERS_PIP}\
            mkdir -p ${REPORT_DIR}; mkdir -p ${ALLURE_REPORT_DIR};"

          # tpX layout marker → -n = ACTUAL_GPU / X
          TEST_CMDS=""
          N_FUNC=$(( ACTUAL_GPU / 2 ))
          [ $N_FUNC -lt 1 ] && N_FUNC=1
          TEST_CMDS+="(pytest autotest/interface/pipeline/test_pipeline_func.py -m \"not pr_test\" -n ${N_FUNC} --alluredir=${ALLURE_REPORT_DIR} ${COV_PARAM} || true); "

          for tp_size in 1 2 4 8; do
            N=$(( ACTUAL_GPU / tp_size ))
            [ $N -lt 1 ] && continue
            if [ $N -eq 1 ]; then
              TEST_CMDS+="(pytest autotest/interface/pipeline/test_pipeline_longtext_func.py -m \"tp${tp_size} and not pr_test\" --alluredir=${ALLURE_REPORT_DIR} ${COV_PARAM} || true); "
            else
              TEST_CMDS+="(pytest autotest/interface/pipeline/test_pipeline_longtext_func.py -m \"tp${tp_size} and not pr_test\" -n ${N} --alluredir=${ALLURE_REPORT_DIR} ${COV_PARAM} || true); "
            fi
          done

          # Pipeline sleep/wakeup（SLEEP_WAKEUP_MODEL_LIST × pytorch/turbomind；level-2 需 staging 卡时可配 LMDEPLOY_UPDATE_WEIGHTS_CUDA_DEVICE）
          TEST_CMDS+="(pytest autotest/interface/pipeline/test_pipeline_sleep_wakeup.py -m \"not pr_test\" --alluredir=${ALLURE_REPORT_DIR} ${COV_PARAM} || true); "

          # ============================================================
          # Submit rjob
          # ============================================================
          GITHUB_RUN_ID="${{ github.run_id }}"
          make_rjob_name() {
            local tag="$1"
            local suffix="${GITHUB_RUN_ID: -6}$(printf '%04d' $((RANDOM % 10000)))"
            local name="ete-rfr-${tag}-${suffix}"
            name=$(echo "${name}" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9-]/-/g' -e 's/--*/-/g' -e 's/^-*//' -e 's/-*$//')
            local max_len=49  # kubebrain webhook: job name must be < 50 chars
            if [ ${#name} -gt ${max_len} ]; then
              local prefix_max=$((max_len - ${#suffix} - 1))
              local prefix="ete-rfr-${tag}"
              prefix=$(echo "${prefix}" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9-]/-/g' -e 's/--*/-/g' -e 's/^-*//' -e 's/-*$//')
              if [ ${#prefix} -gt ${prefix_max} ]; then
                prefix="${prefix:0:${prefix_max}}"
                prefix=$(echo "${prefix}" | sed -e 's/-*$//')
              fi
              name="${prefix}-${suffix}"
            fi
            echo "${name}"
          }
          JOB_NAME=$(make_rjob_name "pipeline")

          RJOB_CMD="rjob submit \
            --name=${JOB_NAME} \
            --task_name=t0 \
            --namespace=${{ env.RJOB_NAMESPACE }} \
            --charged-group=${{ env.RJOB_CHARGED_GROUP }} \
            --private-machine=group \
            --group=${{ env.RJOB_GROUP }} \
            --gpu=${ACTUAL_GPU} \
            --cpu=${CPU_PER_NODE} \
            --memory=${MEMORY_MB} \
            --image=${DOCKER_IMAGE} \
            ${COMMON_ENV_VARS} \
            ${COMMON_MOUNTS} \
            --host-network=False \
            -- bash -exc '${PIP_SETUP} ${TEST_CMDS}'"

          echo "=== Executing ===" && echo "$RJOB_CMD" | sed 's/  */ \\\n  /g' && echo "================="
          eval "$RJOB_CMD"
          echo "=== Submitted: ${JOB_NAME} ==="


  test_restful:
    if: ${{!cancelled() && (github.event_name == 'schedule' || contains(fromJSON(github.event.inputs.regression_func), 'restful'))}}
    runs-on: [self-hosted, h-razor]
    needs: test_quantization
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # job_kind 维度防止 include 把 distributed 合并进 concurrent pytorch（GHA include 同 backend 会覆盖）
        backend: ${{ fromJSON(inputs.backend || '["turbomind", "pytorch"]')}}
        job_kind: [concurrent]
        include:
          - backend: pytorch
            job_kind: distributed_tp16
            gpu: 8
            nodes: 2
            marker: tp16 and distributed
          - backend: pytorch
            job_kind: distributed_dpep16
            gpu: 8
            nodes: 2
            marker: dp16ep16 and distributed
    steps:
      - name: Submit restful interface test job via rjob
        env:
          BACKEND: ${{ matrix.backend }}
          MARKER: ${{ matrix.marker || '' }}
          GPU: ${{ matrix.gpu || '' }}
          NUM_NODES: ${{ matrix.nodes || 1 }}
          BACKENDS_JSON: ${{ inputs.backend || '["turbomind", "pytorch"]' }}
          INTERFACE_TP_NUMS: ${{ env.INTERFACE_TP_NUMS }}
          INTERFACE_RUN_DISTRIBUTED: ${{ env.INTERFACE_RUN_DISTRIBUTED }}
        run: |
          set -e

          # include 无条件追加；backend 不在入参时跳过
          BACKENDS=$(echo "${BACKENDS_JSON}" | tr -d '[]"' | tr -d "'" | tr ',' ' ')
          SKIP=true
          for b in $BACKENDS; do
            b=$(echo "$b" | tr -d ' ')
            [ "$b" = "${BACKEND}" ] && SKIP=false && break
          done
          if $SKIP; then
            echo "Backend ${BACKEND} not in ${BACKENDS_JSON}, skipping..."
            exit 0
          fi

          WORK_DIR="${{ env.WORK_DIR }}"
          DOCKER_IMAGE="${{ env.DOCKER_IMAGE }}"
          TEST_ENV="${{ env.TEST_ENV }}"
          GPU_PER_NODE=${{ env.GPU_PER_NODE }}
          RUN_ID="${{ env.RUN_ID }}"
          REPORT_DIR="${{ env.REPORT_DIR }}"
          ALLURE_REPORT_DIR="${{ env.ALLURE_REPORT_DIR }}"
          COV_PARAM="${{ env.COV_PARAM }}"
          USE_WHL="${{ env.USE_WHL }}"
          LLM_DIST_DIR="/mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/work_dir/llm_distributed"
          TEST_FILE="autotest/interface/restful/test_restful_interface_llm.py"

          IS_DISTRIBUTED=false
          [[ -n "${MARKER}" ]] && IS_DISTRIBUTED=true

          if $IS_DISTRIBUTED && [ "${INTERFACE_RUN_DISTRIBUTED}" != "true" ]; then
            echo "interface_run_distributed=false, skip multi-node ${MARKER}"
            exit 0
          fi

          HOST_NETWORK="--host-network=False"
          RJOB_PARALLEL=""
          DIST_ENV_SETUP=""
          PROXY_EXTRA_ENV=""
          RESTFUL_EXTRA_ENV="-e INTERFACE_BACKENDS=${BACKEND}"
          DIST_PIP=""

          if $IS_DISTRIBUTED; then
            # ---- 多机 distributed markers (tp16 / dpep16) ----
            LOGICAL_GPU=${GPU}
            NUM_NODES=${NUM_NODES}
            TOTAL_GPU_COUNT=$(( LOGICAL_GPU * NUM_NODES ))
            RJOB_GPU=${LOGICAL_GPU}
            MEMORY_PER_GPU_MB=64000
            MEMORY_MB=$(( RJOB_GPU * MEMORY_PER_GPU_MB ))
            CPU_PER_NODE=$(( 20 * NUM_NODES ))
            if [[ "${NUM_NODES}" -gt 1 ]]; then
              HOST_NETWORK="--host-network=True"
              RJOB_PARALLEL="-P ${NUM_NODES}"
              DIST_ENV_SETUP='export LMDEPLOY_DP_MASTER_ADDR="$MASTER_ADDR"; export LMDEPLOY_DP_MASTER_PORT=29555; export DEEPEP_MAX_TOKENS_PER_RANK=256; '
            fi
            if [[ "${MARKER}" == *dp*ep* ]] || [[ "${MARKER}" == *tp2dp4ep8* ]]; then
              PROXY_EXTRA_ENV="-e LMDEPLOY_PORT=8000 -e PROXY_PORT=8000"
            fi
            RESTFUL_EXTRA_ENV="${RESTFUL_EXTRA_ENV} -e DISTRIBUTED_JOB=true -e TOTAL_GPU_COUNT=${TOTAL_GPU_COUNT} -e LMDEPLOY_SKIP_INTERFACE_SLEEP_WAKEUP=1"
            DIST_PIP="pip install -e ${LLM_DIST_DIR} --no-cache-dir; "
          else
            # ---- Concurrent：tp1..tp8（单机）；tp2dp4ep8 也跟 8 卡同 job ----
            ACTUAL_GPU=${GPU_PER_NODE}
            RJOB_GPU=${ACTUAL_GPU}
            MEMORY_PER_GPU_MB=64000
            if [ "${ACTUAL_GPU}" -lt 8 ]; then
              RJOB_GPU=$(( ACTUAL_GPU + 1 ))
              RESTFUL_EXTRA_ENV="${RESTFUL_EXTRA_ENV} -e DISTRIBUTED_JOB=true -e TOTAL_GPU_COUNT=${ACTUAL_GPU} -e LMDEPLOY_UPDATE_WEIGHTS_CUDA_DEVICE=${ACTUAL_GPU}"
            else
              RESTFUL_EXTRA_ENV="${RESTFUL_EXTRA_ENV} -e LMDEPLOY_SKIP_INTERFACE_SLEEP_WAKEUP=1"
              # 单机 proxy tp2dp4ep8（与 tp8 同容器）；多机才走上面 IS_DISTRIBUTED
              if [ "${BACKEND}" = "pytorch" ]; then
                DIST_PIP="pip install -e ${LLM_DIST_DIR} --no-cache-dir; "
              fi
            fi
            CPU_PER_NODE=$(( RJOB_GPU * 10 ))
            MEMORY_MB=$(( RJOB_GPU * MEMORY_PER_GPU_MB ))
          fi

          COMMON_ENV_VARS="-e HF_HUB_CACHE=/mnt/shared-storage-gpfs2/gpfs2-shared-public/huggingface/hub \
            -e HF_DATASETS_CACHE=/mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/eval_resource/hf_cache \
            -e TIKTOKEN_CACHE_DIR=/mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/eval_resource/share_tiktoken \
            -e TIKTOKEN_ENCODINGS_BASE=/mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/eval_resource/tiktoken_encodings \
            -e HF_DATASETS_OFFLINE=1 \
            -e TRANSFORMERS_OFFLINE=1 \
            -e HF_EVALUATE_OFFLINE=1 \
            -e HF_HUB_OFFLINE=1 \
            -e TEST_ENV=${TEST_ENV} \
            -e RUN_ID=${RUN_ID} \
            -e PIP_INDEX_URL=\"http://mirrors.i.h.pjlab.org.cn/pypi/simple/\" \
            -e PIP_EXTRA_INDEX_URL=\"http://pypi.i.h.pjlab.org.cn/brain/dev/+simple\" \
            -e PIP_TRUSTED_HOST=\"mirrors.i.h.pjlab.org.cn pypi.i.h.pjlab.org.cn\""

          COMMON_MOUNTS="--mount=gpfs://gpfs1/llmrazor-share:/mnt/shared-storage-user/llmrazor-share \
            --mount=gpfs://gpfs1/large-model-center-share-weights:/mnt/shared-storage-user/large-model-center-share-weights \
            --mount=gpfs://gpfs1/puyudelivery:/mnt/shared-storage-user/puyudelivery \
            --mount=gpfs://gpfs2/gpfs2-shared-public:/mnt/shared-storage-gpfs2/gpfs2-shared-public \
            --mount=gpfs://gpfs2/llmit1:/mnt/shared-storage-gpfs2/llmit1"

          WHL_INSTALL=""
          if [ "${USE_WHL}" == "true" ]; then
            WHL_INSTALL="pip uninstall lmdeploy -y; pip install lmdeploy-*.whl --no-deps; "
          fi

          TRANSFORMERS_PIP=""
          if [ -n "${TRANSFORMERS_VERSION}" ]; then
            TRANSFORMERS_PIP="pip install transformers==${TRANSFORMERS_VERSION} --no-cache-dir; "
          elif [[ "${TEST_ENV}" == *"legacy"* ]]; then
            TRANSFORMERS_PIP="pip install transformers==4.57.6 --no-cache-dir; "
          fi

          PIP_SETUP="cd ${WORK_DIR}; \
            ${WHL_INSTALL}\
            pip install pytest --no-cache-dir; \
            pip install /mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/work_dir/pytest_rerunfailures-16.5-py3-none-any.whl --no-cache-dir --no-deps; \
            pip install /mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/cicd-autotest/work_dir/pytest_assume-2.4.3-py3-none-any.whl; \
            pip install -r requirements/test.txt --no-cache-dir; \
            ${DIST_PIP}\
            ${TRANSFORMERS_PIP}\
            mkdir -p ${REPORT_DIR}; mkdir -p ${ALLURE_REPORT_DIR};"

          if $IS_DISTRIBUTED; then
            # 多机：pytest -m "tp16 and distributed" / "dp16ep16 and distributed"（无 -n）
            TEST_CMDS="echo INTERFACE_BACKENDS=\${INTERFACE_BACKENDS} MARKER=${MARKER}; "
            TEST_CMDS+="(pytest ${TEST_FILE} -m \"${MARKER}\" --alluredir=${ALLURE_REPORT_DIR} ${COV_PARAM} || true); "
            REMOTE_CMD="${DIST_ENV_SETUP}${PIP_SETUP}${TEST_CMDS}"
            case "${MARKER}" in
              *dp16ep16*) M_TAG=dpep16;;
              *tp16*) M_TAG=tp16;;
              *) M_TAG=dist;;
            esac
            JOB_TAG="rfr-${M_TAG}"
          else
            # INTERFACE_TP_NUMS e.g. "1,2" or "1,2,4,8" — only those tp* layout markers
            TP_NUMS=$(echo "${INTERFACE_TP_NUMS}" | tr ',' ' ')
            TEST_CMDS="echo INTERFACE_BACKENDS=\${INTERFACE_BACKENDS} INTERFACE_TP_NUMS=${INTERFACE_TP_NUMS}; "
            RUN_TP2DP4EP8=false
            for tp_size in ${TP_NUMS}; do
              tp_size=$(echo "${tp_size}" | tr -d ' ')
              [ -z "${tp_size}" ] && continue
              N=$(( ACTUAL_GPU / tp_size ))
              [ $N -lt 1 ] && continue
              [ "${tp_size}" = "8" ] && RUN_TP2DP4EP8=true
              if [ $N -eq 1 ]; then
                TEST_CMDS+="(pytest ${TEST_FILE} -m \"tp${tp_size}\" --alluredir=${ALLURE_REPORT_DIR} ${COV_PARAM} || true); "
              else
                TEST_CMDS+="(pytest ${TEST_FILE} -m \"tp${tp_size}\" -n ${N} --alluredir=${ALLURE_REPORT_DIR} ${COV_PARAM} || true); "
              fi
            done
            # 单机 8 卡：tp2dp4ep8 与 tp8 同 job（不另开 matrix）；仅当 INTERFACE_TP_NUMS 含 8
            # DP>1 必须设 LMDEPLOY_DP_MASTER_*（与多机 DIST_ENV_SETUP 对齐）；单机无 MASTER_ADDR 则回落 127.0.0.1
            if $RUN_TP2DP4EP8 && [ "${BACKEND}" = "pytorch" ] && [ "${ACTUAL_GPU}" -ge 8 ]; then
              TEST_CMDS+="(DISTRIBUTED_JOB=true TOTAL_GPU_COUNT=${ACTUAL_GPU} LMDEPLOY_PORT=8000 PROXY_PORT=8000 LMDEPLOY_DP_MASTER_ADDR=\${MASTER_ADDR:-127.0.0.1} LMDEPLOY_DP_MASTER_PORT=29555 DEEPEP_MAX_TOKENS_PER_RANK=256 pytest ${TEST_FILE} -m \"tp2dp4ep8 and distributed\" --alluredir=${ALLURE_REPORT_DIR} ${COV_PARAM} || true); "
            fi
            REMOTE_CMD="${PIP_SETUP} ${TEST_CMDS}"
            case "${BACKEND}" in turbomind) B_TAG=tm;; pytorch) B_TAG=pt;; *) B_TAG="${BACKEND}";; esac
            JOB_TAG="rfr-${B_TAG}"
          fi

          GITHUB_RUN_ID="${{ github.run_id }}"
          make_rjob_name() {
            local tag="$1"
            local suffix="${GITHUB_RUN_ID: -6}$(printf '%04d' $((RANDOM % 10000)))"
            local name="ete-rfr-${tag}-${suffix}"
            name=$(echo "${name}" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9-]/-/g' -e 's/--*/-/g' -e 's/^-*//' -e 's/-*$//')
            local max_len=49
            if [ ${#name} -gt ${max_len} ]; then
              local prefix_max=$((max_len - ${#suffix} - 1))
              local prefix="ete-rfr-${tag}"
              prefix=$(echo "${prefix}" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9-]/-/g' -e 's/--*/-/g' -e 's/^-*//' -e 's/-*$//')
              if [ ${#prefix} -gt ${prefix_max} ]; then
                prefix="${prefix:0:${prefix_max}}"
                prefix=$(echo "${prefix}" | sed -e 's/-*$//')
              fi
              name="${prefix}-${suffix}"
            fi
            echo "${name}"
          }
          JOB_NAME=$(make_rjob_name "${JOB_TAG}")

          RJOB_CMD="rjob submit \
            --name=${JOB_NAME} \
            --task_name=t0 \
            --namespace=${{ env.RJOB_NAMESPACE }} \
            --charged-group=${{ env.RJOB_CHARGED_GROUP }} \
            --private-machine=group \
            --group=${{ env.RJOB_GROUP }} \
            --gpu=${RJOB_GPU} \
            --cpu=${CPU_PER_NODE} \
            --memory=${MEMORY_MB} \
            --image=${DOCKER_IMAGE} \
            ${COMMON_ENV_VARS} \
            ${RESTFUL_EXTRA_ENV} \
            ${PROXY_EXTRA_ENV} \
            ${COMMON_MOUNTS} \
            ${HOST_NETWORK} \
            ${RJOB_PARALLEL} \
            -- bash -exc '${REMOTE_CMD}'"

          echo "=== Executing ===" && echo "$RJOB_CMD" | sed 's/  */ \\\n  /g' && echo "================="
          eval "$RJOB_CMD"
          echo "=== Submitted: ${JOB_NAME} ==="
